name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: annotated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://annotated:annotated@127.0.0.1:5432/annotated
      PGSSL: disable
      S3_BUCKET: annotated-integration
      S3_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: true
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: annotated
          POSTGRES_PASSWORD: annotated
          POSTGRES_DB: annotated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U annotated -d annotated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start S3-compatible service
        run: >-
          docker run --detach --rm --name annotated-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=minioadmin
          --env MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: Wait for S3-compatible service
        shell: bash
        run: |
          for attempt in {1..30}; do
            echo "Waiting for S3-compatible service (attempt ${attempt}/30)"
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "S3-compatible service did not become ready" >&2
          exit 1
      - name: Apply query-native PostgreSQL schema
        run: npm run db:migrate
      - name: Build web app
        run: npm run build
      - name: Verify release claims and downloadable artifact
        run: npm run check:release-truth
      - name: Inventory Chrome Web Store readiness
        run: npm run check:store:inventory
      - name: Run tests
        run: npm test
      - name: Verify compatibility journal and relational tables agree
        run: npm run check:relational-integrity -- --output relational-integrity.json
      - name: Check JavaScript syntax
        shell: bash
        run: for file in server/*.js src/*.js extension/*.js test/*.js scripts/*.js scripts/*.mjs e2e/*.mjs e2e/lib/*.mjs; do node --check "$file"; done
      - name: Check package diff
        run: git diff --check
      - name: Package extension
        run: npm run package:extension
      - name: Check extension package contents
        shell: bash
        run: |
          package_version="$(node -p 'require("./extension/manifest.json").version')"
          package_path="annotated-extension-v${package_version}.zip"
          test "$(unzip -Z1 "$package_path" | grep -vc '/$')" = 26
          test "$(unzip -Z1 "$package_path" | grep -c '^clip-range.js$')" = 1
          test "$(unzip -Z1 "$package_path" | grep -c '^capture-state.js$')" = 1
          test "$(unzip -Z1 "$package_path" | grep -c '^share-kit.js$')" = 1
          if unzip -Z1 "$package_path" | grep -E '(^|/)(\.env|data/|node_modules/|dist/)'; then
            echo "runtime extension package contains development files" >&2
            exit 1
          fi
      - name: Exercise production backup artifact
        shell: bash
        env:
          NODE_ENV: production
          ANNOTATED_STORAGE: postgres
          ANNOTATED_ASSET_STORAGE: s3
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/annotated-backup
          BACKUP_MAX_OBJECTS: 1000
        run: |
          set -eu
          pg_dump --version
          pg_restore --version
          npm run backup:production
          BACKUP_DIR="$BACKUP_OUTPUT_DIR" npm run backup:verify
          test -s "$BACKUP_OUTPUT_DIR/postgres.dump"
          test -s "$BACKUP_OUTPUT_DIR/objects.json"
          test -s "$BACKUP_OUTPUT_DIR/manifest.json"
      - name: Restore backup into an isolated recovery database
        shell: bash
        env:
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/annotated-backup
          RECOVERY_DATABASE_URL: postgresql://annotated:annotated@127.0.0.1:5432/annotated_recovery_ci
        run: |
          set -eu
          PGPASSWORD=annotated psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username=annotated \
            --dbname=postgres \
            --command='CREATE DATABASE annotated_recovery_ci'
          BACKUP_DIR="$BACKUP_OUTPUT_DIR" \
            RUN_RECOVERY_DRILL=true \
            RECOVERY_DATABASE_URL="$RECOVERY_DATABASE_URL" \
            npm run backup:verify
      - name: Stop S3-compatible service
        if: always()
        run: docker stop annotated-minio 2>/dev/null || true

  browser:
    name: Packaged Chrome Gate B
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANNOTATED_E2E_ARTIFACTS: ${{ github.workspace }}/artifacts/e2e
      ANNOTATED_E2E_HEADED: 1
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install release Chromium
        run: npx playwright install --with-deps chromium
      - name: Build checksummed release
        run: npm run build
      - name: Run packaged-extension browser gate without retries
        run: xvfb-run -a npm run test:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-b-browser-${{ github.sha }}
          path: |
            artifacts/e2e
            dist/release
          if-no-files-found: error
          retention-days: 14

  image:
    name: Production image (${{ matrix.platform }})
    needs: [test, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: annotated-ci-amd64
          - platform: linux/arm64
            tag: annotated-ci-arm64
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0
      - name: Build production image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.tag }}
          provenance: false
      - name: Verify pinned provider runtime
        run: docker run --rm --platform "${{ matrix.platform }}" --entrypoint /usr/local/bin/yt-dlp "${{ matrix.tag }}" --version
      - name: Start production service dependencies
        shell: bash
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          NETWORK_NAME: annotated-${{ matrix.tag }}
        run: |
          set -eu
          docker network create "$NETWORK_NAME"
          docker run --detach --name "${NETWORK_NAME}-postgres" --network "$NETWORK_NAME" \
            --env POSTGRES_USER=annotated \
            --env POSTGRES_PASSWORD=annotated \
            --env POSTGRES_DB=annotated \
            postgres:16
          docker run --detach --name "${NETWORK_NAME}-minio" --network "$NETWORK_NAME" \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            echo "Waiting for PostgreSQL (attempt ${attempt}/30)"
            if docker exec "${NETWORK_NAME}-postgres" pg_isready -U annotated -d annotated >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "${NETWORK_NAME}-postgres" pg_isready -U annotated -d annotated
          bucket_ready=false
          for attempt in {1..30}; do
            echo "Waiting for MinIO bucket API (attempt ${attempt}/30)"
            if docker run --rm --network "$NETWORK_NAME" \
              --env S3_BUCKET=annotated-smoke \
              --env S3_REGION=us-east-1 \
              --env S3_ENDPOINT="http://${NETWORK_NAME}-minio:9000" \
              --env S3_FORCE_PATH_STYLE=true \
              --env S3_ACCESS_KEY_ID=minioadmin \
              --env S3_SECRET_ACCESS_KEY=minioadmin \
              --entrypoint node "$IMAGE_TAG" --input-type=module -e 'import { S3Client, CreateBucketCommand } from "@aws-sdk/client-s3"; const client = new S3Client({ region: process.env.S3_REGION, endpoint: process.env.S3_ENDPOINT, forcePathStyle: true, credentials: { accessKeyId: process.env.S3_ACCESS_KEY_ID, secretAccessKey: process.env.S3_SECRET_ACCESS_KEY } }); try { await client.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET })); } catch (error) { if (!["BucketAlreadyOwnedByYou", "BucketAlreadyExists"].includes(error.Code)) throw error; }'; then
              bucket_ready=true
              break
            fi
            sleep 1
          done
          test "$bucket_ready" = true
          docker run --rm --network "$NETWORK_NAME" \
            --env "DATABASE_URL=postgresql://annotated:annotated@${NETWORK_NAME}-postgres:5432/annotated" \
            --env PGSSL=disable \
            --entrypoint node "$IMAGE_TAG" scripts/migrate.js
      - name: Start production application
        shell: bash
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          NETWORK_NAME: annotated-${{ matrix.tag }}
          APP_CONTAINER: annotated-${{ matrix.tag }}-app
        run: |
          set -eu
          docker run --detach --name "$APP_CONTAINER" --network "$NETWORK_NAME" \
            --env NODE_ENV=production \
            --env HOST=0.0.0.0 \
            --env PORT=8787 \
            --env "PUBLIC_ORIGIN=http://${APP_CONTAINER}:8787" \
            --env "APP_ORIGIN=http://${APP_CONTAINER}:8787" \
            --env "CORS_ORIGIN=http://${APP_CONTAINER}:8787" \
            --env CHROME_EXTENSION_IDS=omlikcdpcdhfmdojdalfdeihgjmgikkg \
            --env AUTH_REQUIRED=true \
            --env GOOGLE_CLIENT_ID=ci-google-client \
            --env GOOGLE_CLIENT_SECRET=ci-google-secret \
            --env X_CLIENT_ID=ci-x-client \
            --env X_CLIENT_SECRET=ci-x-secret \
            --env "DATABASE_URL=postgresql://annotated:annotated@${NETWORK_NAME}-postgres:5432/annotated" \
            --env PGSSL=disable \
            --env ANNOTATED_STORAGE=postgres \
            --env ANNOTATED_ASSET_STORAGE=s3 \
            --env S3_BUCKET=annotated-smoke \
            --env S3_REGION=us-east-1 \
            --env "S3_ENDPOINT=http://${NETWORK_NAME}-minio:9000" \
            --env S3_FORCE_PATH_STYLE=true \
            --env S3_ACCESS_KEY_ID=minioadmin \
            --env S3_SECRET_ACCESS_KEY=minioadmin \
            --env YTDLP_BIN=/usr/local/bin/yt-dlp \
            "$IMAGE_TAG"
      - name: Start standalone production media worker
        shell: bash
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          NETWORK_NAME: annotated-${{ matrix.tag }}
          WORKER_CONTAINER: annotated-${{ matrix.tag }}-worker
        run: |
          set -eu
          docker run --detach --name "$WORKER_CONTAINER" --network "$NETWORK_NAME" \
            --env NODE_ENV=production \
            --env "DATABASE_URL=postgresql://annotated:annotated@${NETWORK_NAME}-postgres:5432/annotated" \
            --env PGSSL=disable \
            --env ANNOTATED_STORAGE=postgres \
            --env ANNOTATED_ASSET_STORAGE=s3 \
            --env S3_BUCKET=annotated-smoke \
            --env S3_REGION=us-east-1 \
            --env "S3_ENDPOINT=http://${NETWORK_NAME}-minio:9000" \
            --env S3_FORCE_PATH_STYLE=true \
            --env S3_ACCESS_KEY_ID=minioadmin \
            --env S3_SECRET_ACCESS_KEY=minioadmin \
            --env YTDLP_BIN=/usr/local/bin/yt-dlp \
            "$IMAGE_TAG" npm run worker
          for attempt in {1..30}; do
            if docker logs "$WORKER_CONTAINER" 2>&1 | grep -q '"event":"media_worker_started"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$WORKER_CONTAINER" || true
          exit 1
      - name: Verify production readiness over the container network
        shell: bash
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          NETWORK_NAME: annotated-${{ matrix.tag }}
          APP_CONTAINER: annotated-${{ matrix.tag }}-app
        run: |
          set -eu
          for attempt in {1..30}; do
            echo "Waiting for production readiness (attempt ${attempt}/30)"
            if ready=$(docker run --rm --network "$NETWORK_NAME" "$IMAGE_TAG" node --input-type=module -e "const response = await fetch('http://${APP_CONTAINER}:8787/api/ready'); const body = await response.text(); console.log(body); process.exit(response.ok ? 0 : 1)"); then
              printf '%s\n' "$ready"
              printf '%s\n' "$ready" | jq -e '.status == "ready" and .persistence == "postgres" and .mediaRuntime.status == "external" and .mediaRuntime.role == "api" and .mediaRuntime.concurrency == 0'
              exit 0
            fi
            sleep 2
          done
          docker logs "$APP_CONTAINER" || true
          exit 1
      - name: Verify production media fixture inside the image
        shell: bash
        env:
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          set -eu
          docker run --rm --platform "${{ matrix.platform }}" \
            --env ANNOTATED_STORAGE=file \
            --env ANNOTATED_ASSET_STORAGE=local \
            --env ANNOTATED_PROCESS_ROLE=media-worker \
            --entrypoint node "$IMAGE_TAG" --test test/media-policy.test.js
      - name: Stop production smoke containers
        if: always()
        shell: bash
        env:
          NETWORK_NAME: annotated-${{ matrix.tag }}
          APP_CONTAINER: annotated-${{ matrix.tag }}-app
          WORKER_CONTAINER: annotated-${{ matrix.tag }}-worker
        run: |
          docker logs "$APP_CONTAINER" 2>/dev/null || true
          docker logs "$WORKER_CONTAINER" 2>/dev/null || true
          docker rm -f "$APP_CONTAINER" "$WORKER_CONTAINER" "${NETWORK_NAME}-postgres" "${NETWORK_NAME}-minio" 2>/dev/null || true
          docker network rm "$NETWORK_NAME" 2>/dev/null || true
