name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: annotated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://annotated:annotated@127.0.0.1:5432/annotated
      PGSSL: disable
      S3_BUCKET: annotated-integration
      S3_REGION: us-east-1
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: true
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: annotated
          POSTGRES_PASSWORD: annotated
          POSTGRES_DB: annotated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U annotated -d annotated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start S3-compatible service
        run: >-
          docker run --detach --rm --name annotated-minio
          --publish 9000:9000
          --env MINIO_ROOT_USER=minioadmin
          --env MINIO_ROOT_PASSWORD=minioadmin
          minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - name: Wait for S3-compatible service
        shell: bash
        run: |
          for attempt in {1..30}; do
            echo "Waiting for S3-compatible service (attempt ${attempt}/30)"
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "S3-compatible service did not become ready" >&2
          exit 1
      - name: Build web app
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Check JavaScript syntax
        shell: bash
        run: for file in server/*.js src/*.js extension/*.js test/*.js scripts/*.js; do node --check "$file"; done
      - name: Check package diff
        run: git diff --check
      - name: Package extension
        run: npm run package:extension
      - name: Check extension package contents
        shell: bash
        run: |
          package_version="$(node -p 'require("./extension/manifest.json").version')"
          package_path="annotated-extension-v${package_version}.zip"
          test "$(unzip -Z1 "$package_path" | wc -l | tr -d ' ')" = 18
          test "$(unzip -Z1 "$package_path" | grep -c '^clip-range.js$')" = 1
          if unzip -Z1 "$package_path" | grep -E '(^|/)(\.env|data/|node_modules/|dist/)'; then
            echo "runtime extension package contains development files" >&2
            exit 1
          fi
      - name: Stop S3-compatible service
        if: always()
        run: docker stop annotated-minio 2>/dev/null || true

  image:
    name: Production image (${{ matrix.platform }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: annotated-ci-amd64
          - platform: linux/arm64
            tag: annotated-ci-arm64
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ matrix.tag }}
          provenance: false
      - name: Verify pinned provider runtime
        run: docker run --rm --platform "${{ matrix.platform }}" --entrypoint /usr/local/bin/yt-dlp "${{ matrix.tag }}" --version
      - name: Start production service dependencies
        shell: bash
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          NETWORK_NAME: annotated-${{ matrix.tag }}
        run: |
          set -eu
          docker network create "$NETWORK_NAME"
          docker run --detach --name "${NETWORK_NAME}-postgres" --network "$NETWORK_NAME" \
            --env POSTGRES_USER=annotated \
            --env POSTGRES_PASSWORD=annotated \
            --env POSTGRES_DB=annotated \
            postgres:16
          docker run --detach --name "${NETWORK_NAME}-minio" --network "$NETWORK_NAME" \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in {1..30}; do
            echo "Waiting for PostgreSQL (attempt ${attempt}/30)"
            if docker exec "${NETWORK_NAME}-postgres" pg_isready -U annotated -d annotated >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "${NETWORK_NAME}-postgres" pg_isready -U annotated -d annotated
          bucket_ready=false
          for attempt in {1..30}; do
            echo "Waiting for MinIO bucket API (attempt ${attempt}/30)"
            if docker run --rm --network "$NETWORK_NAME" \
              --env S3_BUCKET=annotated-smoke \
              --env S3_REGION=us-east-1 \
              --env S3_ENDPOINT="http://${NETWORK_NAME}-minio:9000" \
              --env S3_FORCE_PATH_STYLE=true \
              --env S3_ACCESS_KEY_ID=minioadmin \
              --env S3_SECRET_ACCESS_KEY=minioadmin \
              --entrypoint node "$IMAGE_TAG" --input-type=module -e 'import { S3Client, CreateBucketCommand } from "@aws-sdk/client-s3"; const client = new S3Client({ region: process.env.S3_REGION, endpoint: process.env.S3_ENDPOINT, forcePathStyle: true, credentials: { accessKeyId: process.env.S3_ACCESS_KEY_ID, secretAccessKey: process.env.S3_SECRET_ACCESS_KEY } }); try { await client.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET })); } catch (error) { if (!["BucketAlreadyOwnedByYou", "BucketAlreadyExists"].includes(error.Code)) throw error; }'; then
              bucket_ready=true
              break
            fi
            sleep 1
          done
          test "$bucket_ready" = true
          docker run --rm --network "$NETWORK_NAME" \
            --env "DATABASE_URL=postgresql://annotated:annotated@${NETWORK_NAME}-postgres:5432/annotated" \
            --env PGSSL=disable \
            --entrypoint node "$IMAGE_TAG" scripts/migrate.js
      - name: Start production application
        shell: bash
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          NETWORK_NAME: annotated-${{ matrix.tag }}
          APP_CONTAINER: annotated-${{ matrix.tag }}-app
        run: |
          set -eu
          docker run --detach --name "$APP_CONTAINER" --network "$NETWORK_NAME" \
            --env NODE_ENV=production \
            --env HOST=0.0.0.0 \
            --env PORT=8787 \
            --env "PUBLIC_ORIGIN=http://${APP_CONTAINER}:8787" \
            --env "APP_ORIGIN=http://${APP_CONTAINER}:8787" \
            --env "CORS_ORIGIN=http://${APP_CONTAINER}:8787" \
            --env AUTH_REQUIRED=true \
            --env GOOGLE_CLIENT_ID=ci-google-client \
            --env GOOGLE_CLIENT_SECRET=ci-google-secret \
            --env X_CLIENT_ID=ci-x-client \
            --env X_CLIENT_SECRET=ci-x-secret \
            --env "DATABASE_URL=postgresql://annotated:annotated@${NETWORK_NAME}-postgres:5432/annotated" \
            --env PGSSL=disable \
            --env ANNOTATED_STORAGE=postgres \
            --env ANNOTATED_ASSET_STORAGE=s3 \
            --env S3_BUCKET=annotated-smoke \
            --env S3_REGION=us-east-1 \
            --env "S3_ENDPOINT=http://${NETWORK_NAME}-minio:9000" \
            --env S3_FORCE_PATH_STYLE=true \
            --env S3_ACCESS_KEY_ID=minioadmin \
            --env S3_SECRET_ACCESS_KEY=minioadmin \
            --env YTDLP_BIN=/usr/local/bin/yt-dlp \
            "$IMAGE_TAG"
      - name: Verify production readiness over the container network
        shell: bash
        env:
          IMAGE_TAG: ${{ matrix.tag }}
          NETWORK_NAME: annotated-${{ matrix.tag }}
          APP_CONTAINER: annotated-${{ matrix.tag }}-app
        run: |
          set -eu
          for attempt in {1..30}; do
            echo "Waiting for production readiness (attempt ${attempt}/30)"
            if ready=$(docker run --rm --network "$NETWORK_NAME" "$IMAGE_TAG" node --input-type=module -e "const response = await fetch('http://${APP_CONTAINER}:8787/api/ready'); const body = await response.text(); console.log(body); process.exit(response.ok ? 0 : 1)"); then
              printf '%s\n' "$ready"
              printf '%s\n' "$ready" | jq -e '.status == "ready" and .persistence == "postgres" and .mediaRuntime.status == "ready"'
              exit 0
            fi
            sleep 2
          done
          docker logs "$APP_CONTAINER" || true
          exit 1
      - name: Verify production media fixture inside the image
        shell: bash
        env:
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          set -eu
          docker run --rm --platform "${{ matrix.platform }}" \
            --env ANNOTATED_STORAGE=file \
            --env ANNOTATED_ASSET_STORAGE=local \
            --entrypoint node "$IMAGE_TAG" --test test/media-policy.test.js
      - name: Stop production smoke containers
        if: always()
        shell: bash
        env:
          NETWORK_NAME: annotated-${{ matrix.tag }}
          APP_CONTAINER: annotated-${{ matrix.tag }}-app
        run: |
          docker logs "$APP_CONTAINER" 2>/dev/null || true
          docker rm -f "$APP_CONTAINER" "${NETWORK_NAME}-postgres" "${NETWORK_NAME}-minio" 2>/dev/null || true
          docker network rm "$NETWORK_NAME" 2>/dev/null || true
