<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotated controlled player fixture</title>
    <meta property="og:type" content="video.other" />
    <style>
      body { max-width: 52rem; margin: 3rem auto; padding: 0 1.5rem; font: 16px/1.5 system-ui, sans-serif; color: #24211f; }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: linear-gradient(135deg, #1d1a18, #b0674d); }
      code { color: #8a5847; }
    </style>
  </head>
  <body>
    <main>
      <h1>Controlled player</h1>
      <p>This repository-owned clock makes player selection, seeking, and playback deterministic without downloading third-party media.</p>
      <video id="fixturePlayer" controls muted aria-label="Synthetic controlled video"></video>
      <p>Current fixture time: <code id="clock">12.000</code></p>
    </main>
    <script>
      (() => {
        const element = document.querySelector('#fixturePlayer');
        const clock = document.querySelector('#clock');
        const state = { currentTime: 12, duration: 180, paused: false, ended: false, muted: false, playbackRate: 1, playCalls: 0, pauseCalls: 0 };
        const updateClock = () => { clock.textContent = state.currentTime.toFixed(3); };
        for (const [name, descriptor] of Object.entries({
          currentTime: { get: () => state.currentTime, set: (value) => { state.currentTime = Number(value) || 0; updateClock(); element.dispatchEvent(new Event('timeupdate')); } },
          duration: { get: () => state.duration },
          paused: { get: () => state.paused },
          ended: { get: () => state.ended },
          muted: { get: () => state.muted, set: (value) => { state.muted = Boolean(value); } },
          playbackRate: { get: () => state.playbackRate, set: (value) => { state.playbackRate = Number(value) || 1; } },
          seekable: { get: () => ({ length: 1, start: () => 0, end: () => state.duration }) },
        })) Object.defineProperty(element, name, { configurable: true, ...descriptor });
        element.play = async () => { state.playCalls += 1; state.paused = false; element.dispatchEvent(new Event('play')); };
        element.pause = () => { state.pauseCalls += 1; state.paused = true; element.dispatchEvent(new Event('pause')); };
        window.annotatedFixturePlayer = {
          setTime(value) { state.currentTime = Number(value); updateClock(); element.dispatchEvent(new Event('timeupdate')); },
          snapshot() { return { ...state }; },
        };
        updateClock();
      })();
    </script>
  </body>
</html>
